name: tests

on:
  push:
  pull_request:

jobs:
  security-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q center_expense_management tests
      - name: Run security and installation contracts
        run: python -m unittest discover -s tests -v
